name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      # Needed to publish a release for version tags.
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs XcodeGen from mise.toml.
      - uses: jdx/mise-action@v5.1.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test AIAKit
        run: swift test --package-path Packages/AIAKit

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: >
          xcodebuild
          -project AIALabels.xcodeproj
          -scheme AIALabels
          -configuration Release
          -derivedDataPath build
          build

      - name: Package app
        run: ditto -c -k --keepParent "build/Build/Products/Release/AIA Labels.app" AIA-Labels.zip

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AIA-Labels
          path: AIA-Labels.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" AIA-Labels.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

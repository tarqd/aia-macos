name: AIALabels
options:
  bundleIdPrefix: dev.aialabels
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  AIAKit:
    path: Packages/AIAKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  AIALabels:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: AIAKit
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AIA Labels
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: Label artwork © Timothy F. Cook, CC BY 4.0.
    entitlements:
      path: App/AIALabels.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aialabels.AIALabels
        PRODUCT_NAME: AIA Labels
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc signing for local builds; set DEVELOPMENT_TEAM for distribution.
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
